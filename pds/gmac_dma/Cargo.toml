[package]
name = "r5s-heartbeat"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
sel4 = { path = "../../vendor/rust-sel4/crates/sel4" }
sel4-microkit = { path = "../../vendor/rust-sel4/crates/sel4-microkit" }

[features]
fault-injection = []
