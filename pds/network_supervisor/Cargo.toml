[package]
name = "r5s-heartbeat"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
sel4-microkit = { path = "../../vendor/rust-sel4/crates/sel4-microkit" }

[features]
router-runtime = ["supervised"]
lan-gated = []
lan1-only = []
lan-dhcp = ["lan1-only"]
supervised = ["lan-dhcp"]
fault-injection = []
plain-leds = []

[profile.release]
panic = "abort"
lto = true
opt-level = 2

