# HTTP response headers for the sel4.hda.me site.
# Include inside the TLS server block:
#
#   server {
#       ...
#       include /path/to/front/deploy/headers.conf;
#   }
#
# HSTS: for one year, browsers only reach this host over HTTPS.
# `always` also sends it on error responses. Add `; includeSubDomains` only if
# every subdomain of the served host is HTTPS as well.

add_header Strict-Transport-Security "max-age=31536000" always;
